<script type="text/x-dc">
class Component extends DCLogic {
  /* ===== HERO FILM =====
     Відео (8 с) грає один раз за сесію. Після нього лишається фінальний кадр, і камера плавно
     «доїжджає»: щит зсувається праворуч, ліворуч проявляються заголовок і пошук.
     _filmSettle(): рух камери по фінальному кадру. a → b; x, y — точка кадру (щит), 0…1;
     s — наближення (1 = кадр заповнює екран); vx, vy — де ця точка стає на екрані.
     land — горизонтальні екрани, port — вертикальні. dur — тривалість, с.
     Фінальний кадр — окреме фото брами зі щитом (обкладинка), відео в нього плавно перетікає. */
  _filmSettle() {
    return {
      dur: 1.4,
      land: { a: { x: 0.5, y: 0.5, s: 1 }, b: { x: 0.5, y: 0.5, s: 1 } },
      port: { a: { x: 0.5, y: 0.5, s: 1 }, b: { x: 0.5, y: 0.5, s: 1 } }
    };
  }

  _initFilm(film) {
    const pin = film.closest('.hero-pin') || film.parentNode;
    const q = (s) => pin.querySelector(s);
    const video = film.querySelector('video');
    const still = film.querySelector('.hf-still');
    const cam = still && still.querySelector('.hf-cam');
    const img = still && still.querySelector('img');
    const copy = q('#hero-copy'), tint = q('#hero-tint'), prog0 = null;
    // Відео обираємо за реальними пропорціями першого екрана, а не вікна (у редакторі макета вікно дуже високе)
    const VID = { land: ['assets/hero-pent/pent.mp4', 'assets/hero-pent/pent.webm'], port: ['assets/hero-pent/pent.mp4', 'assets/hero-pent/pent.webm'] };   // відео пентхауса 8 с (одна версія 16:9)
    const pickSrc = () => {
      const w = pin.clientWidth || window.innerWidth, h = pin.clientHeight || window.innerHeight;
      const set = (w / h < 0.75 && w < 760) ? VID.port : VID.land;
      const mp4 = video && video.canPlayType && video.canPlayType('video/mp4; codecs="avc1.640028"');
      return mp4 ? set[0] : set[1];
    };
    const prog = { get style() { const el = q('#hf-prog'); return el ? el.style : {}; } };
    const ST = this._filmSettle();
    const cl = (v) => Math.max(0, Math.min(1, v));
    const ease = (v) => 0.5 - 0.5 * Math.cos(Math.PI * v);
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let settleT = 1, sraf = 0;
    const place = (u) => {
      if (!cam || !img) return;
      const W = img.naturalWidth || 1920, H = img.naturalHeight || 1080;
      const box = still || pin;
      const vw = box.clientWidth || window.innerWidth, vh = box.clientHeight || window.innerHeight;
      const P = vw / vh < 1 ? ST.port : ST.land;
      const e = ease(cl(u));
      const L = (k, d) => { const a = P.a[k] == null ? d : P.a[k], b = P.b[k] == null ? d : P.b[k]; return a + (b - a) * e; };
      const k = Math.max(vw / W, vh / H) * L('s', 1);
      const dw = W * k, dh = H * k;
      const tx = Math.min(0, Math.max(vw - dw, vw * L('vx', 0.5) - L('x', 0.5) * dw));
      const ty = Math.min(0, Math.max(vh - dh, vh * L('vy', 0.5) - L('y', 0.5) * dh));
      cam.style.width = W + 'px';
      cam.style.height = H + 'px';
      cam.style.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0) scale(' + k.toFixed(5) + ')';
    };
    const settle = (instant) => {
      if (sraf) { cancelAnimationFrame(sraf); sraf = 0; }
      if (instant || reduce) { settleT = 1; place(1); return; }
      const t0 = performance.now();
      const step = (now) => { settleT = cl((now - t0) / 1000 / ST.dur); place(settleT); sraf = settleT < 1 ? requestAnimationFrame(step) : 0; };
      settleT = 0; place(0);
      sraf = requestAnimationFrame(step);
    };

    const showCopy = () => {};   // видимість девізу й пошуку керується атрибутом data-film на <html> (CSS)
    const setUi = (isPlaying) => {
      // Видимість «Пропустити» / «Переглянути ще раз» — через атрибут на <html>, щоб перерендер сторінки її не скидав
      document.documentElement.setAttribute('data-film', isPlaying ? 'play' : 'done');
    };

    let playing = false, started = false, raf = 0, waitFrom = 0;
    const onScroll = () => {
      const track = pin.parentNode;
      if (playing && track && -track.getBoundingClientRect().top > pin.offsetHeight * 0.2) finish(false);
    };
    const tick = () => {
      raf = 0;
      if (!playing) return;
      if (prog && video.duration) prog.style.transform = 'scaleX(' + cl(video.currentTime / video.duration).toFixed(4) + ')';
      if (!started && performance.now() - waitFrom > 5000) { finish(true); return; }   // відео не стартувало за 5 с
      raf = requestAnimationFrame(tick);
    };
    const finish = (instant) => {
      const was = playing;
      playing = false;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
      document.removeEventListener('scroll', onScroll, { capture: true });
      try { sessionStorage.setItem('rs-film', '1'); } catch (e) {}
      if (video) { try { video.pause(); } catch (e) {} }
      const soft = was && !instant;
      if (still) { still.style.transition = 'none'; still.style.opacity = '1'; }
      settle(!soft);
      if (video) { video.style.transition = soft ? 'opacity .9s ease' : 'none'; video.style.opacity = '0'; }
      if (prog) prog.style.transform = 'scaleX(1)';
      setUi(false);
      showCopy(true, !soft);
    };
    const play = () => {
      if (!video || typeof video.play !== 'function') { finish(true); return; }
      if (sraf) { cancelAnimationFrame(sraf); sraf = 0; }
      playing = true; started = false; waitFrom = performance.now();
      showCopy(false, true);
      setUi(true);
      if (prog) prog.style.transform = 'scaleX(0)';
      if (still) { still.style.transition = 'none'; still.style.opacity = '0'; }
      settleT = 0; place(0);
      video.muted = true;
      video.style.transition = '';
      video.style.opacity = '1';
      const want = pickSrc();
      const go = (n) => {
        if (!playing) return;
