<sc-if value="{{o.noFee}}" hint-placeholder-val="{{true}}"><span style="position: absolute; left: 14px; top: 50px; background: #3F6B3A; color: #FFFFFF; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 7px 12px; border-radius: 4px">Без комісії</span></sc-if>

</div>
</div>
