<h1 style="margin: 14px 0 0; font-size: clamp(44px, 5.4vw, 76px); line-height: 1">Політика конфіденційності</h1>
<p style="margin: 18px 0 0; font-size: 17px; line-height: 1.65; color: #5E5A53">Як ми збираємо, використовуємо та захищаємо дані, які ви залишаєте на сайті RESIDENT.</p>
</section>
<section class="wrap" style="padding-top: 48px">
<div style="max-width: 900px">
<div style="background: #FFFFFF; border-radius: 10px; padding: clamp(24px, 4vw, 56px); padding-top: 12px">
<section style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-top: 1px solid #EEEAE2"><h2 style="margin: 0; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.15">1. Загальні положення</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Ця Політика конфіденційності визначає, як агентство нерухомості RESIDENT (Дніпро) збирає, використовує та захищає персональні дані користувачів сайту (далі — «Сайт»).</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Ми обробляємо персональні дані відповідно до Закону України «Про захист персональних даних» та інших нормативних актів України. Користуючись Сайтом і надсилаючи заявку, ви погоджуєтеся з умовами цієї Політики.</p></section><section style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-top: 1px solid #EEEAE2"><h2 style="margin: 0; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.15">2. Які дані ми збираємо</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Ми отримуємо лише ті дані, які ви самостійно залишаєте у формах на Сайті: ім’я, номер телефону, тип запиту (купити, орендувати, продати, здати), коментар до заявки. У формі вакансії додатково — досвід роботи та резюме, якщо ви його прикріпили.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Сайт також може збирати технічні дані: тип пристрою та браузера, IP-адресу, сторінки, які ви переглядали. Ці дані знеособлені й потрібні для роботи та покращення Сайту.</p></section><section style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-top: 1px solid #EEEAE2"><h2 style="margin: 0; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.15">3. Мета обробки</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Ми використовуємо ваші дані, щоб зв’язатися з вами, підібрати об’єкти нерухомості, провести консультацію, оцінку чи супровід угоди, а також розглянути вашу кандидатуру на вакансію.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Ми не надсилаємо рекламних розсилок без вашої окремої згоди.</p></section><section style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-top: 1px solid #EEEAE2"><h2 style="margin: 0; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.15">4. Зберігання та захист</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Дані зберігаються не довше, ніж це потрібно для мети обробки або вимагає законодавство. Доступ до них мають лише працівники агентства, які обробляють ваше звернення.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Ми вживаємо організаційних і технічних заходів, щоб захистити дані від втрати, несанкціонованого доступу чи розголошення.</p></section><section style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-top: 1px solid #EEEAE2"><h2 style="margin: 0; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.15">5. Передача третім особам</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Ми не продаємо і не передаємо ваші дані третім особам для їхніх маркетингових цілей. Передача можлива лише у випадках, передбачених законом, або коли це потрібно для угоди за вашою згодою (наприклад, нотаріусу).</p></section><section style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-top: 1px solid #EEEAE2"><h2 style="margin: 0; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.15">6. Ваші права</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Ви маєте право знати, які ваші дані ми обробляємо, вимагати їх виправлення або видалення, а також відкликати згоду на обробку. Для цього напишіть нам на пошту або зателефонуйте.</p></section><section style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-top: 1px solid #EEEAE2"><h2 style="margin: 0; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.15">7. Контакти</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Агентство нерухомості RESIDENT, м. Дніпро, вул. Європейська, 7А, 4 поверх, офіс 402.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Email: an.resident.dp@gmail.com · Телефон: 097 123 45 12, 067 635 14 88.</p></section><section style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-top: 1px solid #EEEAE2"><h2 style="margin: 0; font-size: clamp(26px, 2.4vw, 34px); line-height: 1.15">8. Зміни до Політики</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #5E5A53">Ми можемо оновлювати цю Політику. Актуальна редакція завжди доступна на цій сторінці.</p></section>
