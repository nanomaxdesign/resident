<h1 class="disp" style="font-size: clamp(32px, 4.2vw, 60px)">Будуй кар’єру в нерухомості разом із нами</h1>
<p class="txt" style="font-size: 19px; color: #111111">Хочеш розвиватися, гідно заробляти та бачити результат своєї роботи? Приєднуйся до команди RESIDENT!</p>
<p class="txt">Ми — агентство нерухомості у Дніпрі, яке поєднує досвід, сучасний підхід і командну роботу. Допомагаємо клієнтам знаходити потрібну нерухомість, а нашим співробітникам — розкривати свій потенціал, здобувати нові навички та зростати професійно.</p>

</div>
<div class="why">
<div class="wc"><span class="wn">01</span><span class="wt">Високий дохід</span><span class="wd">Твій заробіток залежить від результатів, активності та залученості. Винагорода за угодами дає можливість впливати на власний фінансовий результат.</span></div>
<div class="wc"><span class="wn">02</span><span class="wt">Кар’єрне зростання</span><span class="wd">Починай із першого кроку та розвивайся разом із компанією. Ми підтримуємо ініціативність, відповідальність і прагнення до нових професійних вершин.</span></div>
<div class="wc"><span class="wn">03</span><span class="wt">Навчання за рахунок компанії</span><span class="wd">Навчаємо основам роботи з нерухомістю, переговорам, продажам і супроводу угод. Ти отримаєш підтримку досвідченого наставника та знання, необхідні для впевненого старту.</span></div>
<div class="wc"><span class="wn">04</span><span class="wt">Команда, яка підтримує</span><span class="wd">Працюй із колегами, ділися досвідом, отримуй допомогу та разом досягай результатів. У RESIDENT важливі не лише особисті досягнення, а й спільний успіх.</span></div>
<div class="wc"><span class="wn">05</span><span class="wt">Інструменти для результату</span><span class="wd">Використовуй базу об’єктів і клієнтів, рекламні можливості компанії та підтримку команди, щоб ефективніше знаходити покупців, продавців і орендарів.</span></div>
<div class="wc"><span class="wn">06</span><span class="wt">Гнучкість і розвиток</span><span class="wd">Плануй робочий день з урахуванням зустрічей із клієнтами, показів нерухомості та роботи в офісі. Розвивай навички, розширюй коло контактів і будуй кар’єру у своєму темпі.</span></div>
</div>
</section>

<section class="wrap" style="padding-top: 120px">
<div class="two">
<div style="background: #FFFFFF; border-radius: 12px; padding: clamp(28px, 3.5vw, 44px); display: flex; flex-direction: column; gap: 24px">

<ul class="list">
<li><span class="dot"></span>Консультуватимеш клієнтів із питань купівлі, продажу та оренди нерухомості.</li>
<li><span class="dot"></span>Аналізуватимеш ринок і підбиратимеш об’єкти відповідно до потреб клієнтів.</li>
<li><span class="dot"></span>Проводитимеш презентації та покази нерухомості.</li>
<li><span class="dot"></span>Вестимеш переговори з покупцями, продавцями, власниками й орендарями.</li>
<li><span class="dot"></span>Шукатимеш нових клієнтів і розвиватимеш професійні контакти.</li>
<li><span class="dot"></span>Допомагатимеш узгоджувати умови угод та оформлювати необхідні документи.</li>
<li><span class="dot"></span>Супроводжуватимеш клієнтів на всіх етапах співпраці за підтримки команди та юриста.</li>
</ul>
</div>
<div id="offer" class="dark" style="background: #111111; color: #FFFFFF; border-radius: 12px; padding: clamp(28px, 3.5vw, 44px); display: flex; flex-direction: column; gap: 24px">

<ul class="list">
<li><span class="dot"></span>Професійне навчання за рахунок компанії.</li>
<li><span class="dot"></span>Наставника на етапі адаптації та перших угод.</li>
<li><span class="dot"></span>Конкурентну винагороду з можливістю високого доходу за результатами роботи.</li>
<li><span class="dot"></span>Юридичну підтримку під час супроводу угод.</li>
<li><span class="dot"></span>Рекламну підтримку та доступ до бази нерухомості й клієнтів.</li>

<p class="txt" style="font-size: 15px; color: #6A665F">Вища освіта та досвід у нерухомості будуть перевагою, але ми також відкриті до кандидатів без досвіду та студентів, готових поєднувати навчання з роботою.</p>

<div class="chip"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>відповідально ставишся до своїх завдань</div>
<div class="chip"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>легко знаходиш спільну мову з людьми</div>
<div class="chip"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>вмієш слухати, домовлятися та аргументувати свою позицію</div>
<div class="chip"><span class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>проявляєш ініціативу й не боїшся нових викликів</div>

<div style="position: relative; border-radius: 10px; padding: clamp(24px, 3vw, 36px); display: flex; flex-direction: column; gap: 16px; justify-content: center; background: rgba(17,17,17,0.82); color: #F7F5F0">

<p style="margin: 0; font-size: 16px; line-height: 1.6; color: rgba(247,245,240,0.78)">Не обов’язково знати все з першого дня. Важливо мати бажання навчатися, діяти та рухатися вперед.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: rgba(247,245,240,0.78)"><b style="font-weight: 600; color: #F7F5F0">RESIDENT — команда, з якою можна більше.</b> Надсилай резюме або залишай заявку. Познайомимося, розповімо про роботу та разом визначимо, чи підходимо одне одному.</p>
