<style>
body{margin:0;background:#F7F5F0;font-family:'Manrope',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111;text-decoration:none}a:hover{color:#8A6D35}
.wrap{max-width:1320px;margin:0 auto;padding:0 32px;box-sizing:border-box}
.glass{background:rgba(255,255,255,0.42);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid rgba(255,255,255,0.75);box-shadow:0 10px 40px rgba(17,17,17,0.10),inset 0 1px 0 rgba(255,255,255,0.8)}
.ph{background:linear-gradient(155deg,#E9E4DA 0%,#C5A15D 100%);position:relative;overflow:hidden}
.img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8A6D35;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius:6px;border:0;font:inherit;font-size:14px;font-weight:600;letter-spacing:.02em;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.btn-dark{background:#111111;color:#FFFFFF}.btn-dark:hover{background:#3A342C;color:#FFFFFF}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:6px;border:1px solid #D8CCB4;background:#FFFFFF;font:inherit;font-size:14px;cursor:pointer;color:#111111}
.chip-on{background:#111111;border-color:#111111;color:#FFFFFF}
.sel{font:inherit;font-size:14px;color:#111111;background:#FFFFFF;border:1px solid #D8CCB4;border-radius:6px;min-height:44px;padding:0 16px}
.lbl{display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:500;color:#5E5A53}
.in{font:inherit;font-size:15px;color:#111111;background:rgba(255,255,255,0.75);border:1px solid #EEEAE2;border-radius:8px;min-height:44px;padding:0 14px;width:100%;box-sizing:border-box;min-width:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side{flex:1 1 280px;max-width:320px}
@media (max-width:760px){.wrap{padding:0 16px}.hide-m{display:none !important}.side{max-width:none}}
.hd-nav a{color:#F7F5F0;padding:8px 0;border-bottom:1px solid transparent;text-decoration:none}.hd-nav a:hover,.hd-nav a.on{color:#C5A15D;border-bottom-color:#C5A15D}.hd-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:6px;background:#C5A15D;color:#111111 !important;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}.hd-btn:hover{background:#D4B274}.ft a{color:rgba(247,245,240,0.72);text-decoration:none}.ft a:hover{color:#C5A15D}.ft-h{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#C5A15D;font-weight:600;margin-bottom:6px}.ft-soc{width:40px;height:40px;border-radius:999px;border:1px solid rgba(197,161,93,0.5);display:flex;align-items:center;justify-content:center;color:#C5A15D !important}.ft-soc:hover{background:#C5A15D;color:#111111 !important}.ft-row{display:flex;gap:10px;align-items:flex-start}.ft-row svg{flex:none;margin-top:2px}
h1,h2,.h2,.disp,.sv{font-family:'Cormorant Garamond',Georgia,serif !important;font-weight:600 !important;letter-spacing:-0.005em !important}
.h2{font-size:clamp(34px,3.6vw,54px)}
.eyebrow{color:#8A6D35 !important;font-weight:600}
.nm{font-size:22px !important;line-height:1.1}
.glass{border:0 !important;box-shadow:0 6px 20px rgba(17,17,17,0.12) !important}
.btn-gold{background:#C5A15D !important;color:#111111 !important}.btn-gold:hover{background:#D4B274 !important}.btn-dark{background:#111111;color:#F7F5F0}.btn-dark:hover{background:#2A2824;color:#F7F5F0}.eyebrow{font-size:12px !important;letter-spacing:.2em !important;text-transform:uppercase;color:#8A6D35 !important;font-weight:600 !important}.h2{font-size:clamp(38px,4.4vw,60px) !important;line-height:1.02 !important}

<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<div ref="{{rootRef}}" style="width: 100%; overflow: hidden">
<span ref="{{cursorRef}}" style="display: none"></span>

<div style="background: #111111; border-bottom: 1px solid rgba(197,161,93,0.25)">
<header class="wrap" style="padding-top: 16px; padding-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
<a href="index.html" aria-label="Resident — на головну" style="display: block; flex: none"><img src="assets/brand/logo-full.webp" alt="Resident — агентство нерухомості" style="height: 60px; width: auto; display: block" width="1000" height="306"></a>
<nav class="hd-nav hide-m" style="display: flex; gap: 40px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase"><a href="about.html">Про нас</a><a href="index.html#services" onClick="{{go}}">Послуги</a><a href="team.html">Команда</a><a href="#contacts" onClick="{{jump}}">Контакти</a></nav>
<a class="hd-btn hide-m" href="index.html#form" onClick="{{go}}">Консультація</a>
</header>
</div>

<!-- TITLE + DEAL SWITCH -->
<section class="wrap" style="padding-top: 32px">
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 14px">
<span class="eyebrow">{{crumb}}</span>
<h1 style="margin: 0; font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(22px, 2.6vw, 40px); letter-spacing: -0.03em; font-weight: 700; line-height: 1.1">{{title}}</h1>
</div>
<div role="tablist" aria-label="Тип угоди" style="display: flex; gap: 4px; padding: 4px; border-radius: 6px; background: #FFFFFF">
<sc-for list="{{deals}}" as="d" hint-placeholder-count="2">
<sc-if value="{{d.on}}" hint-placeholder-val="{{false}}">
<button type="button" role="tab" aria-selected="true" class="btn btn-dark" onClick="{{d.pick}}">{{d.label}}</button>
</sc-if>
<sc-if value="{{d.off}}" hint-placeholder-val="{{true}}">
<button type="button" role="tab" aria-selected="false" class="btn" style="background: transparent; color: #111111; border: 1px solid #111111" onClick="{{d.pick}}">{{d.label}}</button>
</sc-if>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 28px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="8">
<sc-if value="{{k.on}}" hint-placeholder-val="{{false}}">
<button type="button" class="chip chip-on" aria-pressed="true" onClick="{{k.pick}}">{{k.label}}</button>
</sc-if>
<sc-if value="{{k.off}}" hint-placeholder-val="{{true}}">
<button type="button" class="chip" aria-pressed="false" onClick="{{k.pick}}">{{k.label}}</button>
</sc-if>
</sc-for>
</div>
</section>

<!-- SIDEBAR + RESULTS -->
<section class="wrap" style="padding-top: 28px; display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start">

<form class="glass side" style="background: rgba(255,255,255,0.55); border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box" onSubmit="{{apply}}">
<span style="font-size: 20px; font-weight: 600; letter-spacing: -0.01em">Фільтри</span>
<label class="lbl">№ об'єкта<input class="in" type="text" placeholder="Напр. 213-187-922" value="{{f.id}}" onChange="{{h.id}}"></label>
<label class="lbl">Район
<select class="in" value="{{f.dist}}" onChange="{{h.dist}}"><option value="all">Усі райони</option><optgroup label="Правий берег"><option value="right">Увесь правий берег</option><option value="Соборний">Соборний</option><option value="Центральний">Центральний</option><option value="Шевченківський">Шевченківський</option><option value="Чечелівський">Чечелівський</option><option value="Новокодацький">Новокодацький</option></optgroup><optgroup label="Лівий берег"><option value="left">Увесь лівий берег</option><option value="Амур-Нижньодніпровський">Амур-Нижньодніпровський</option><option value="Індустріальний">Індустріальний</option><option value="Самарський">Самарський</option></optgroup></select></label>
<div class="lbl"><span>Кімнат</span><div class="pair"><input class="in" type="number" min="1" placeholder="від" aria-label="Кімнат від" value="{{f.rFrom}}" onChange="{{h.rFrom}}"><input class="in" type="number" min="1" placeholder="до" aria-label="Кімнат до" value="{{f.rTo}}" onChange="{{h.rTo}}"></div></div>
<div class="lbl"><span>Площа загальна, м²</span><div class="pair"><input class="in" type="number" min="0" placeholder="від" aria-label="Площа від" value="{{f.aFrom}}" onChange="{{h.aFrom}}"><input class="in" type="number" min="0" placeholder="до" aria-label="Площа до" value="{{f.aTo}}" onChange="{{h.aTo}}"></div></div>
<div class="lbl"><span>Поверх</span><div class="pair"><input class="in" type="number" min="1" placeholder="від" aria-label="Поверх від" value="{{f.flFrom}}" onChange="{{h.flFrom}}"><input class="in" type="number" min="1" placeholder="до" aria-label="Поверх до" value="{{f.flTo}}" onChange="{{h.flTo}}"></div></div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 44px; cursor: pointer"><input type="checkbox" checked="{{f.notLast}}" onChange="{{h.notLast}}" style="width: 20px; height: 20px; accent-color: #111111">Не останній поверх</label>
<div class="lbl"><span>Ціна</span><div style="display: grid; grid-template-columns: 1fr 1fr 78px; gap: 8px"><input class="in" type="number" min="0" placeholder="від" aria-label="Ціна від" value="{{f.pFrom}}" onChange="{{h.pFrom}}"><input class="in" type="number" min="0" placeholder="до" aria-label="Ціна до" value="{{f.pTo}}" onChange="{{h.pTo}}"><select class="in" aria-label="Валюта" value="{{f.cur}}" onChange="{{h.cur}}" style="padding: 0 8px"><option value="$">$</option><option value="грн">грн</option></select></div></div>
<label class="lbl">Без комісії
<select class="in" value="{{f.noFee}}" onChange="{{h.noFee}}"><option value="any">Не вказано</option><option value="yes">Так, без комісії</option></select></label>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
<button type="submit" class="btn btn-gold" style="width: 100%">Пошук</button>
<button type="button" class="btn" style="width: 100%; background: transparent; border: 1px solid #111111; color: #111111" onClick="{{reset}}">Очистити</button>
</div>
</form>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: #FFFFFF; border-radius: 10px; padding: 10px 10px 10px 20px">
<span style="font-size: 15px; color: #5E5A53">Знайдено: <strong style="color: #111111">{{count}}</strong></span>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #5E5A53">Сортувати
<select class="sel" value="{{sort}}" onChange="{{pickSort}}"><option value="new">за датою (спочатку нові)</option><option value="cheap">за ціною (спочатку дешевші)</option><option value="exp">за ціною (спочатку дорожчі)</option></select></label>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="background: #FFFFFF; border-radius: 10px; padding: 48px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center">
<span style="font-size: 22px; font-weight: 600">За цими фільтрами поки нічого немає</span>
<span style="font-size: 15px; color: #6A665F">Змініть фільтри або залиште заявку, і ми підберемо варіанти вручну.</span>
<a class="btn btn-gold" href="index.html#form" onClick="{{go}}">Залишити заявку</a>
</div>
</sc-if>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px">
<sc-for list="{{items}}" as="o" hint-placeholder-count="9">
<article style="background: #FFFFFF; border-radius: 10px; padding: 8px; display: flex; flex-direction: column">
<div class="ph" style="border-radius: 10px; height: 220px">
<a href="{{o.objHref}}" onClick="{{o.open}}" aria-label="{{o.t}}" style="position: absolute; inset: 0"><img class="img" src="{{o.img}}" alt="{{o.t}}" width="1200" height="800"></a>
<span class="glass" style="position: absolute; left: 12px; top: 12px; border-radius: 6px; padding: 7px 13px; font-size: 12px; font-weight: 500">{{o.kindLabel}}</span>
<button type="button" class="glass" aria-label="Зберегти об'єкт" style="position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #111111"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
<div class="glass" style="position: absolute; left: 12px; bottom: 12px; border-radius: 8px; padding: 9px 14px; display: flex; flex-direction: column">
<span style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em">{{o.priceTxt}}</span>
<span style="font-size: 12px; color: #5E5A53">{{o.sub}}</span>
</div>
</div>
<div style="padding: 14px 10px 10px; display: flex; flex-direction: column; gap: 9px; flex: 1; container-type: inline-size">
<h2 style="margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3"><a href="{{o.objHref}}" onClick="{{o.open}}">{{o.t}}</a></h2>
<span style="font-size: 13px; color: #6A665F; display: flex; gap: 6px; align-items: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>{{o.loc}}</span>
<div style="display: flex; gap: 4px; flex-wrap: nowrap; padding-top: 6px; border-top: 1px solid #EEEAE2">
<span style="font-size: clamp(10.5px, calc((100cqw - 50px) / 20.3), 12px); padding: 5px 7px; border-radius: 6px; background: #F3EEE3; white-space: nowrap; flex: none">{{o.p1}}</span>
<span style="font-size: clamp(10.5px, calc((100cqw - 50px) / 20.3), 12px); padding: 5px 7px; border-radius: 6px; background: #F3EEE3; white-space: nowrap; flex: none">{{o.p2}}</span>
<span style="font-size: clamp(10.5px, calc((100cqw - 50px) / 20.3), 12px); padding: 5px 7px; border-radius: 6px; background: #F3EEE3; white-space: nowrap; flex: none">{{o.p3}}</span>
</div>
<div style="margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #8A6D35">
<span>ID {{o.id}}</span>
<sc-if value="{{o.noFee}}" hint-placeholder-val="{{false}}"><span style="color: #3F6B3A; font-weight: 500">Без комісії</span></sc-if>
</div>
</div>
</article>
</sc-for>
</div>

<sc-if value="{{showPages}}" hint-placeholder-val="{{true}}">
<nav aria-label="Сторінки" style="margin-top: 16px; display: flex; justify-content: center; align-items: center; gap: 8px">
<button type="button" class="chip chip-on" aria-current="page" style="min-width: 44px; justify-content: center">1</button>
<button type="button" class="chip" style="min-width: 44px; justify-content: center">2</button>
<button type="button" class="chip" style="min-width: 44px; justify-content: center">3</button>
<span style="padding: 0 6px; color: #6A665F">…</span>
<button type="button" class="chip" style="min-width: 44px; justify-content: center">{{pages}}</button>
</nav>
</sc-if>
</div>
</section>

<section class="wrap" style="padding-top: 56px">
<div style="background: #111111; color: #FFFFFF; border-radius: 12px; padding: 24px clamp(24px, 3vw, 40px); display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 520px">
<span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: clamp(28px, 2.8vw, 38px); font-weight: 600; line-height: 1.1">Не знайшли потрібне?</span>
<span style="font-size: 15px; line-height: 1.5; color: rgba(247,245,240,0.75)">Залиште заявку. Фахівець підбере варіанти з бази, яких ще немає на сайті.</span>
</div>
<a class="btn" href="index.html#form" onClick="{{go}}" style="background: #C5A15D; color: #111111">Залишити заявку <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</section>

<!-- FOOTER -->
<footer id="contacts" class="ft" style="margin-top: 110px; background: #111111; color: #F7F5F0; position: relative; overflow: hidden">
<img src="assets/brand/shield-crown-560.webp" alt="" aria-hidden="true" style="position: absolute; right: 2%; top: 30px; height: min(560px, 85%); width: auto; opacity: 0.05; pointer-events: none; user-select: none" width="409" height="560" loading="lazy" decoding="async">
<div class="wrap" style="position: relative; padding-top: 80px; padding-bottom: 28px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 40px; padding-bottom: 56px">
<div style="display: flex; flex-direction: column; gap: 16px">

      rootRef: (el) => {
        if (!el || this._dt) return;
        const check = () => {
          let v = null;
          try { v = sessionStorage.getItem('rs-dist'); } catch (e) {}
          let d = null, name = null;
          if (v) { try { sessionStorage.removeItem('rs-dist'); } catch (e) {} [d, name] = v.split('|'); }
          else {
            let h = ''; try { h = decodeURIComponent((window.location.hash || '').slice(1)); } catch (e) {}
            if (h.startsWith('kind=') && h !== this._lastHash) { this._lastHash = h; this.setState({ kind: h.slice(5) }); try { el.scrollIntoView({ block: 'start' }); } catch (e) {} return; }
            if (!h.startsWith('dist=') || h === this._lastHash) return;
            this._lastHash = h; name = h.slice(5); d = 'sale';
          }
          const dist = name || 'all';
          this.setState({ deal: d === 'rent' ? 'rent' : 'sale', kind: 'all', f: { dist }, a: { dist } });
          try { el.scrollIntoView({ block: 'start' }); } catch (e) {}
        };
        check();
        this._dt = setInterval(check, 100);
        window.addEventListener('storage', check);
        window.addEventListener('hashchange', check);
      },
      go: (e) => { const h = (e && e.currentTarget && e.currentTarget.getAttribute('href')) || ''; const i = h.indexOf('#'); if (i >= 0) { try { sessionStorage.setItem('rs-goto', h.slice(i + 1)); } catch (err) {} } },
      f, h, sort, items,
      count: items.length,
      empty: items.length === 0,
      pages: deal === 'sale' ? 24 : 9,
      showPages: items.length > 0 && kind === 'all' && Object.keys(st.a || {}).length === 0,
      crumb: 'Каталог · ' + (deal === 'sale' ? 'продаж' : 'оренда'),
      title: (deal === 'sale' ? 'Продаж' : 'Оренда') + ' · ' + (kind === 'all' ? 'уся нерухомість' : (cur ? cur[1].toLowerCase() : '')),
      apply: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ a: Object.assign({}, f) }); },
      reset: () => this.setState({ f: {}, a: {} }),
      pickSort: (e) => this.setState({ sort: e.target.value }),
      deals: [['sale', 'Продаж'], ['rent', 'Оренда']].map(([id, label]) => ({ label, on: deal === id, off: deal !== id, pick: () => this.setState({ deal: id, kind: 'all', f: {}, a: {} }) })),
      kinds: kindsList.map(([id, label]) => ({ label, on: kind === id, off: kind !== id, pick: () => this.setState({ kind: id }) }))
    };
  }
}
